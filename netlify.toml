[build]
  # Base directory (root of the repository)
  base = "."
  # Build command for Netlify
  command = "node scripts/netlify-build.mjs"
  # Directory to publish
  publish = "dist"

[build.environment]
  # Pause switch: set SITE_PAUSED=true in the Netlify UI (or uncomment below), then deploy.
  # SITE_PAUSED = "true"
  # Frontend Environment Variables for Netlify
  VITE_APP_NAME = "The11EximOverSeas Ventures"
  VITE_APP_VERSION = "1.0.0"
  VITE_CONTACT_EMAIL = "the11eximoverseas@gmail.com"
  VITE_CONTACT_PHONE_PRIMARY = "+91 9617270009"
  VITE_CONTACT_PHONE_SECONDARY = "+91 9993006125"
  VITE_ENABLE_ANALYTICS = "true"
  VITE_ENABLE_DEBUG = "false"
  # VITE_GOOGLE_MAPS_API_KEY: set it in the Netlify UI if a map is added, never commit the key
  VITE_DOMAIN = "www.the11eximoverseas.com"
  VITE_API_URL = "/api"

# Redirects are handled by _redirects file in public directory

[context.production]
  # Production-specific settings
  command = "node scripts/netlify-build.mjs"

[context.deploy-preview]
  # Deploy preview settings
  command = "node scripts/netlify-build.mjs"

[context.branch-deploy]
  # Branch deploy settings
  command = "node scripts/netlify-build.mjs"

# Custom domain configuration
[context.production.environment]
  VITE_DOMAIN = "the11eximoverseas.com"
  VITE_CANONICAL_URL = "https://the11eximoverseas.com"